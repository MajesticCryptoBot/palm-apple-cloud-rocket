name: Build WIRE Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [wire-real-bots-installer]
    paths:
      - "desktop/**"
      - "src/**"
      - "scripts/**"
      - "vite.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/wire-windows-installer.yml"

concurrency:
  group: wire-installer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Type check
        run: npm run typecheck
      - name: Build local WIRE server
        shell: pwsh
        run: |
          $env:WIRE_DESKTOP_BUILD = "1"
          npm run build:wire-desktop
      - name: Package Windows installer
        run: npx electron-builder --win nsis --publish never
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: WIRE-Windows-Installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
