<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wire</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0e1621;
      --side: #17212b;
      --in: #182533;
      --out: #2b5278;
      --fg: #f4f6f8;
      --muted: #8b9aab;
      --line: #0c141d;
      --accent: #6ab3f3;
      --ok: #5dca6a;
      --warn: #d7a15a;
      --bad: #e25c5c;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); font: 15px "Segoe UI", Roboto, sans-serif; }
    body { display: flex; min-height: 100dvh; }
    aside { width: 280px; background: var(--side); display: flex; flex-direction: column; border-right: 1px solid var(--line); }
    header, .composer, .rail { background: var(--side); }
    .brand { padding: 16px; font-weight: 650; }
    .brand small { display: block; color: var(--muted); font-weight: 400; font-size: 12px; margin-top: 4px; }
    .chatrow { margin: 4px 8px; padding: 10px; border-radius: 10px; background: #202b36; }
    .dot { width: 8px; height: 8px; border-radius: 99px; display: inline-block; margin-right: 6px; background: var(--muted); }
    .dot.on { background: var(--ok); }
    main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .top { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
    #log { flex: 1; overflow-y: auto; padding: 16px 8vw 12px; }
    .msg { max-width: min(42rem, 92%); margin: 8px 0; padding: 8px 10px 16px; border-radius: 12px; white-space: pre-wrap; position: relative; line-height: 1.4; }
    .msg.bot { background: var(--in); box-shadow: inset 2px 0 0 transparent; }
    .msg.trade { box-shadow: inset 2px 0 0 var(--ok); }
    .msg.alert { box-shadow: inset 2px 0 0 var(--warn); }
    .msg.me { margin-left: auto; background: var(--out); }
    .msg.service { margin: 10px auto; background: transparent; color: var(--muted); font-size: 12px; text-align: center; max-width: 36rem; }
    .time { position: absolute; right: 8px; bottom: 4px; color: #6d7f91; font-size: 11px; }
    .rail { display: flex; gap: 6px; overflow-x: auto; padding: 8px 12px; border-top: 1px solid var(--line); }
    .rail button, .composer button { border: 0; background: #202b36; color: var(--accent); border-radius: 999px; padding: 6px 10px; cursor: pointer; font: inherit; }
    .composer { display: flex; gap: 8px; padding: 10px 12px 14px; }
    textarea { flex: 1; resize: none; border: 0; border-radius: 18px; background: var(--bg); color: var(--fg); padding: 10px 14px; font: inherit; min-height: 44px; }
    .send { background: var(--accent) !important; color: #0e1621 !important; width: 44px; height: 44px; border-radius: 50% !important; }
    .mono { font-family: Consolas, "Segoe UI Mono", monospace; font-size: 12.5px; }
  </style>
</head>
<body>
  <aside>
    <div class="brand">Wire<small>Private desk · this PC only</small></div>
    <div class="chatrow"><span id="dot" class="dot"></span><b>ABinanceTradingBot</b><div id="state" style="color:#8b9aab;font-size:12px;margin-top:4px">Looking for the script…</div></div>
  </aside>
  <main>
    <div class="top"><div><b>ABinanceTradingBot (local)</b><div id="sub" style="color:#8b9aab;font-size:12px">script offline</div></div></div>
    <div id="log"></div>
    <div class="rail" id="rail"></div>
    <form class="composer" id="form">
      <textarea id="box" rows="1" placeholder="Message"></textarea>
      <button class="send" type="submit" aria-label="Send">➤</button>
    </form>
  </main>
  <script>
    const commands = ["/status","/balance","/price","/pair","/buy_price","/mb","/magic_sell","/reset_state","/compound_status","/status2","/pair2","/mb2","/isaac_status","/emergency_isaac","/cancel"];
    const rail = document.getElementById("rail");
    const log = document.getElementById("log");
    const box = document.getElementById("box");
    let after = 0;
    let stuck = true;
    commands.forEach((name) => {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = name;
      b.onclick = () => send(name);
      rail.appendChild(b);
    });
    function tone(text) {
      const t = text.toLowerCase();
      if (/shutdown|failed|error|warning|insufficient|denied|not attached|not connected|rescue/.test(t)) return "alert";
      if (/sell|bought|buy |pair added|trailing|pattern|filled|profit|isaac|order/.test(t)) return "trade";
      return "";
    }
    function add(kind, text, ts) {
      const el = document.createElement("div");
      const look = kind === "me" ? "me" : kind === "service" ? "service" : "bot " + tone(text);
      el.className = "msg " + look + (text.includes("\n") ? " mono" : "");
      el.textContent = text;
      if (kind !== "service") {
        const time = document.createElement("span");
        time.className = "time";
        time.textContent = new Date(ts || Date.now()).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
        el.appendChild(time);
      }
      const near = log.scrollHeight - log.scrollTop - log.clientHeight < 80;
      log.appendChild(el);
      if (stuck || near || kind === "me") log.scrollTop = log.scrollHeight;
    }
    log.addEventListener("scroll", () => { stuck = log.scrollHeight - log.scrollTop - log.clientHeight < 80; });
    async function send(text) {
      text = text.trim();
      if (!text) return;
      add("me", text);
      box.value = "";
      add("service", "typing");
      const typing = log.lastChild;
      try {
        const response = await fetch("/command", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text }) });
        const data = await response.json();
        typing.remove();
        (data.replies || ["No reply."]).forEach((line) => add("bot", String(line)));
      } catch (err) {
        typing.remove();
        add("bot", "Wire bridge did not answer.");
      }
    }
    document.getElementById("form").onsubmit = (e) => { e.preventDefault(); send(box.value); };
    box.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(box.value); } });
    async function poll() {
      try {
        const health = await fetch("/health", { cache: "no-store" }).then((r) => r.json());
        const on = Boolean(health.connected);
        document.getElementById("dot").classList.toggle("on", on);
        document.getElementById("state").textContent = on ? "Script attached" : "Waiting for the script";
        document.getElementById("sub").textContent = on ? "live script" : "script offline";
        const live = await fetch("/live?after=" + after, { cache: "no-store" }).then((r) => r.json());
        after = live.latest || after;
        (live.items || []).forEach((item) => add("bot", item.text, item.ts ? item.ts * 1000 : Date.now()));
      } catch (err) {
        document.getElementById("sub").textContent = "bridge down";
      }
    }
    add("service", "Commands use the real script, including multi-step ones. Type /pair, answer with the pair, and the bot confirms. Live fills appear in this thread.");
    poll();
    setInterval(poll, 1500);
  </script>
</body>
</html>
