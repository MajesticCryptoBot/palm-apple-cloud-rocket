<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>WIRE Companion</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="WIRE" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icons/icon-180.png" />
  <link rel="stylesheet" href="/styles.css" />
  <script>
    /* iOS-safe viewport height (no dvh on older Safari) */
    (function () {
      function setVh() { document.documentElement.style.setProperty("--app-h", window.innerHeight + "px"); }
      window.addEventListener("resize", setVh);
      window.addEventListener("orientationchange", function () { setTimeout(setVh, 250); });
      setVh();
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <script src="/app.js" defer></script>
</body>
</html>
